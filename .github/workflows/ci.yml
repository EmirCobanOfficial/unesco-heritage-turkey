name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Kurulum & Kontrol
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Depoyu çek / Checkout
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} kur / Setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Bağımlılıkları kur / Install dependencies
        run: npm ci

      - name: Güvenlik denetimi / Security audit
        run: npm audit --audit-level=high

      - name: Sözdizimi kontrolü / Syntax check
        run: node --check server.js
